name: RAG React integration checks

on:
  push:
    branches:
      - feat/integrate-rag-react
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the main and v4 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "openai>=1.75,<3"
      - name: Run all project Python tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Install React deps
        run: pnpm install --frozen-lockfile
      - name: Run React tests
        run: pnpm test
      - name: Compile React
        run: pnpm build
